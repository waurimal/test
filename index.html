    <style>

<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">

        <button onclick="window.switchView('teacher-login-view')" class="bg-indigo-800 hover:bg-indigo-900 px-4 py-2 rounded text-sm font-semibold transition shadow-sm">

    <main class="max-w-5xl mx-auto p-4 md:p-8">

        <!-- [VIEW 1] 학생 로그인 (진입 화면) -->

                            <option value="4">4반</option>
                            <option value="5">5반</option>
                            <option value="6">6반</option>
                            <option value="7">7반</option>

                    <!-- 왼쪽: 시험지 영역 -->

                <!-- 모바일용 하단 제출 버튼 -->

        <!-- [VIEW 3] 교사 로그인 화면 -->
        <section id="teacher-login-view" class="view hidden bg-white p-6 md:p-10 rounded-xl shadow-lg max-w-md mx-auto mt-12 border border-gray-100">

        <!-- [VIEW 4] 교사용 관리 대시보드 -->
        <section id="teacher-dashboard-view" class="view hidden bg-white p-6 md:p-8 rounded-xl shadow-lg space-y-6 border border-gray-100">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-extrabold text-indigo-800">학생 응답 및 성취도 관리 대시보드</h2>
                    <p class="text-sm text-gray-500 font-medium mt-1">내재적 설정법(ESS) 기반 자동 채점 시스템 (선다형 + 서답형)</p>

                <div class="flex flex-wrap gap-2">
                    <button onclick="window.fetchSubmissions()" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold text-sm px-4 py-2 rounded-lg transition">새로고침</button>
                    <button onclick="window.openPasswordModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold text-sm px-4 py-2 rounded-lg transition">비밀번호 변경</button>
                    <button onclick="window.logoutTeacher()" class="bg-red-500 hover:bg-red-600 text-white font-semibold text-sm px-4 py-2 rounded-lg transition shadow-sm">로그아웃</button>
                </div>
            </div>

            <!-- 실시간 요약 카드 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 text-center shadow-sm">
                    <div class="text-xs font-bold text-indigo-500 uppercase tracking-wide">총 제출 학생 수</div>
                    <div class="text-3xl font-extrabold text-indigo-900 mt-2" id="stat-total-students">0명</div>
                </div>
                <div class="bg-green-50 p-5 rounded-xl border border-green-100 text-center shadow-sm">
                    <div class="text-xs font-bold text-green-600 uppercase tracking-wide">평균 점수 (총 25점)</div>
                    <div class="text-3xl font-extrabold text-green-900 mt-2" id="stat-avg-score">0 점</div>
                </div>
            </div>

            <!-- 학생 데이터 테이블 -->
            <div class="overflow-x-auto border border-gray-200 rounded-xl shadow-sm mt-6">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-5 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-1/6">소속 정보</th>
                            <th class="px-5 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-1/6">이름 / 제출시각</th>
                            <th class="px-5 py-4 text-center text-xs font-bold text-gray-500 uppercase tracking-wider w-1/6">선다형 / 서답형 점수</th>
                            <th class="px-5 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">응답 데이터 확인 (선다형+서답형)</th>
                        </tr>
                    </thead>
                    <tbody id="student-data-rows" class="bg-white divide-y divide-gray-200 text-sm">
                        <!-- JS에서 동적으로 삽입 -->
                        <tr><td colspan="4" class="px-4 py-8 text-center text-gray-400">데이터를 불러오는 중입니다...</td></tr>

    <!-- [MODAL] 교사 비밀번호 변경 -->
    <div id="pwd-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-8 rounded-xl max-w-sm w-full space-y-6 mx-4 shadow-2xl">
            <h3 class="text-xl font-extrabold text-gray-900">교사용 비밀번호 변경</h3>
            <div>
                <label class="block text-sm font-medium text-gray-700">새 비밀번호</label>
                <input type="password" id="new-teacher-pwd" class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="window.closePasswordModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-5 py-2.5 rounded-lg transition">취소</button>
                <button onclick="window.changeTeacherPassword()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-lg transition shadow-md">저장</button>
            </div>
        </div>
    </div>

    <!-- ==================== JavaScript (Firebase v9) ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 1. 제공해주신 Firebase 구성
        const firebaseConfig = {
            apiKey: "AIzaSyCjcQtgw4cVkl1HWjo49EDr8W-jJXkKy1Q",
            authDomain: "test-b517e.firebaseapp.com",
            projectId: "test-b517e",
            storageBucket: "test-b517e.firebasestorage.app",
            messagingSenderId: "527815074812",
            appId: "1:527815074812:web:7ff3e0280a274af522c879",
            measurementId: "G-S087STJN93"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Firestore 경로 설정
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'english-exam-system';
        const basePath = `artifacts/${appId}/public/data`;
        
        let currentUser = null;
        let actualPassword = "1234";

        // 2. 인증 초기화
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                const pwdDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'teacherConfig');
                const pwdDoc = await getDoc(pwdDocRef);
                if (pwdDoc.exists()) {
                    actualPassword = pwdDoc.data().password;
                } else {
                    await setDoc(pwdDocRef, { password: "1234" });
                }
            }
        });
        
        signInAnonymously(auth).catch((error) => console.error("Auth Error:", error));

        // TTS 오디오 로딩 및 준비 (다중 화자 고도화)
        let availableVoices = [];
        function initVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices();
        }

        window.playAudio = (scriptText) => {
            if (!('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 듣기를 지원하지 않습니다.");
                return;
            }
            window.speechSynthesis.cancel(); // 현재 재생 중지

            // OS 및 브라우저 환경에 따라 최적의 남/여 목소리 탐색
            const femaleVoice = availableVoices.find(v => v.lang.startsWith('en') && /female|zira|samantha|victoria|susan/i.test(v.name)) 
                             || availableVoices.find(v => v.lang.startsWith('en'));
            const maleVoice = availableVoices.find(v => v.lang.startsWith('en') && /male|david|alex|daniel|george/i.test(v.name)) 
                             || availableVoices.find(v => v.lang.startsWith('en'));

            const parts = scriptText.split('|');
            
            parts.forEach(part => {
                const textSegments = part.split(':');
                if(textSegments.length < 2) return;
                
                const speaker = textSegments[0].trim();
                const text = textSegments[1].trim();
                
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-US';
                msg.rate = 0.85; 

                // 화자에 맞춰 목소리와 피치 배정
                if (speaker === 'G' || speaker === 'W') { 
                    if(femaleVoice) msg.voice = femaleVoice;
                    msg.pitch = 1.3; 
                } else if (speaker === 'B' || speaker === 'M') { 
                    if(maleVoice) msg.voice = maleVoice;
                    msg.pitch = 0.8; 
                } else {
                    msg.pitch = 1.0;
                }
                
                window.speechSynthesis.speak(msg);
            });
        };

        // 서답형 채점 유틸리티 함수 (공백/마침표 제거 후 비교)
        function gradeShortAnswer(q, userVal) {
            if (!userVal) return false;
            const normalizedUser = userVal.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');

            if (q.keywords) { // 자유 서술형(키워드 포함 여부)
                return q.keywords.some(kw => normalizedUser.includes(kw));
            }

            if (Array.isArray(q.ans)) {
                return q.ans.some(a => {
                    const normA = a.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');
                    return normalizedUser === normA;
                });
            }

            if (typeof q.ans === 'string') {
                const normA = q.ans.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');
                return normalizedUser === normA;
            }
            return false;
        }

        // 3. 문항 데이터 (총 25문항 - 서답형 정답(ans) 데이터 추가)
        const questions = [
            // 듣기 (1~8)
            { id: 1, type: "choice", area: "듣기", pl: "Level 1 - 기초", q: "1. 대화를 듣고, 남자아이가 몇 학년인지 고르세요.", script: "G: What grade are you in? | B: I'm in the sixth grade.", options: ["2학년", "3학년", "4학년", "5학년", "6학년"], ans: 4 },
            { id: 2, type: "choice", area: "듣기", pl: "Level 1 - 기초", q: "2. 대화를 듣고, 두 사람이 이야기하고 있는 계절을 고르세요.", script: "B: What season do you like? | G: I like winter.", options: ["봄 (spring)", "여름 (summer)", "가을 (fall)", "겨울 (winter)", "건기 (dry season)"], ans: 3 },
            { id: 3, type: "choice", area: "듣기", pl: "Level 2 - 보통", q: "3. 대화를 듣고, 여자아이의 생일을 고르세요.", script: "B: When is your birthday? | G: It is on April fifth.", options: ["3월 5일", "4월 5일", "5월 4일", "4월 15일", "5월 15일"], ans: 1 },
            { id: 4, type: "choice", area: "듣기", pl: "Level 2 - 보통", q: "4. 대화를 듣고, 남자아이가 기분이 좋은 이유로 알맞은 것을 고르세요.", script: "G: Why are you happy? | B: Because I got a black belt in Taekwondo.", options: ["생일이라서", "수학 시험을 잘 봐서", "검은 띠를 따서", "방학이 시작되어서", "개가 병이 나아서"], ans: 2 },
            { id: 5, type: "choice", area: "듣기", pl: "Level 2 - 보통", q: "5. 대화를 듣고, 여자아이가 가려고 하는 목적지의 위치를 고르세요.", script: "G: Excuse me. Where is the library? | B: Go straight one block, and turn right. It's on your left.", options: ["직진 후 좌회전", "직진 후 우회전", "길 건너편", "은행 옆", "두 블록 직진"], ans: 1 },
            { id: 6, type: "choice", area: "듣기", pl: "Level 3 - 우수", q: "6. 대화를 듣고, 설명하는 사람의 특징을 고르세요.", script: "B: What does he look like? | G: He has short curly hair. He is wearing a yellow shirt.", options: ["긴 머리에 파란 셔츠", "짧은 생머리에 노란 셔츠", "짧은 곱슬머리에 노란 셔츠", "긴 곱슬머리에 빨간 셔츠", "짧은 생머리에 파란 셔츠"], ans: 2 },
            { id: 7, type: "short", area: "듣기", pl: "Level 3 - 우수", q: "7. 대화를 듣고, 빈칸에 들어갈 알맞은 영어 요일을 적으세요.\nBoy: I am happy because it's _________.", script: "G: Why are you happy today? | B: Because it's Friday!", ans: "Friday" },
            { id: 8, type: "short", area: "듣기", pl: "Level 4 - 매우 우수", q: "8. 대화를 듣고, 빈칸에 알맞은 영어 단어 두 개를 쉼표(,)로 구분하여 쓰세요.\nPolice: Go ( ⓐ ), and ( ⓑ ) left.\n(입력예시: stop, right)", script: "W: Can I help you? | B: Yes, I lost my way. Where is the library? | W: Go straight, and turn left. It's next to the post office.", ans: ["straight, turn", "straight,turn", "straight turn"] },
            
            // 읽기 (9~17)
            { id: 9, type: "choice", area: "읽기", pl: "Level 1 - 기초", q: "9. 초대장의 [Date: July 12th]에 해당하는 날짜로 알맞은 것은?", options: ["6월 12일", "7월 2일", "7월 12일", "8월 12일", "7월 20일"], ans: 2 },
            { id: 10, type: "choice", area: "읽기", pl: "Level 1 - 기초", q: "10. 다음 문장이 묘사하는 겉모습으로 알맞은 것은?\n'He has big blue eyes.'", options: ["파란 모자를 쓴 사람", "파란 셔츠를 입은 사람", "눈이 크고 파란 눈동자를 가진 사람", "키가 큰 사람", "파란 신발을 신은 사람"], ans: 2 },
            { id: 11, type: "choice", area: "읽기", pl: "Level 2 - 보통", q: "11. ID Card 정보 [Name: James Smith / Grade: 5th]와 일치하는 것은?", options: ["제임스는 4학년이다.", "제임스의 성(Last Name)은 Smith이다.", "제임스는 6학년이다.", "제임스는 축구를 싫어한다.", "제임스는 이름 철자를 모른다."], ans: 1 },
            { id: 12, type: "choice", area: "읽기", pl: "Level 2 - 보통", q: "12. 다음 일기에서 글쓴이가 슬픈 진짜 이유를 고르세요.\n'I am sad because my best friend moved to another city.'", options: ["비가 와서", "축구를 못 해서", "친구가 이사를 가서", "길을 잃어서", "개가 아파서"], ans: 2 },
            { id: 13, type: "choice", area: "읽기", pl: "Level 3 - 우수", q: "13. 문맥상 빈칸에 들어갈 기대 표현을 고르세요.\n'I have a big party. I (  ⓐ  ) wait!'", options: ["don't", "can't", "am", "do", "have"], ans: 1 },
            { id: 14, type: "choice", area: "읽기", pl: "Level 3 - 우수", q: "14. 다음 안내를 읽고 도착지의 방향을 고르세요.\n'Go straight one block and turn left. It's on your right.'", options: ["왼쪽", "오른쪽", "직진", "뒤쪽", "길 건너편"], ans: 1 },
            { id: 15, type: "short", area: "읽기", pl: "Level 3 - 우수", q: "15. 미아 전단지 [He has short straight hair. He is wearing a yellow cap.]를 읽고 빈칸을 채우세요.\nHair: ( ⓐ ) straight hair / Clothes: a yellow ( ⓑ )\n(입력예시: long, shirt)", ans: ["short, cap", "short,cap", "short cap"] },
            { id: 16, type: "short", area: "읽기", pl: "Level 4 - 매우 우수", q: "16. 'Because of this, I can't sleep now!'에서 글쓴이가 밤에 잠을 자지 못하는 이유를 본문에서 찾아 우리말로 자유롭게 쓰세요.\n(예: 내일 놀이공원에 가기 때문에, 어린이날이라서 등)", keywords: ["놀이공원", "어린이날", "어린이 날"] },
            { id: 17, type: "choice", area: "읽기", pl: "Level 4 - 매우 우수", q: "17. 'Go straight two blocks and turn right. It's next to the bank.' 이메일을 읽고, 도착지가 은행의 어느 쪽에 위치해 있는지 고르세요.", options: ["앞에", "뒤에", "옆에", "안에", "건너편에"], ans: 2 },
            
            // 쓰기 (18~25)
            { id: 18, type: "short", area: "쓰기", pl: "Level 1 - 기초", q: "18. 이름 철자 묻기에 대한 답변의 빈칸 알파벳을 대문자로 쓰세요.\nS - M - (    ) - T - H.", ans: "I" },
            { id: 19, type: "short", area: "쓰기", pl: "Level 2 - 보통", q: "19. 땀 흘리며 수박 먹는 그림을 보고 좋아하는 계절(여름)을 영어로 쓰세요.\nI like ______________.", img: "🥵🍉", ans: "summer" },
            { id: 20, type: "short", area: "쓰기", pl: "Level 2 - 보통", q: "20. 달력의 12월 25일을 보고 '12월'의 영어 단어 첫 글자를 대문자로 쓰세요.\nIt's on _______________ 25th.", ans: "December" },
            { id: 21, type: "short", area: "쓰기", pl: "Level 2 - 보통", q: "21. 제공된 피곤한 표정을 보고 빈칸에 알맞은 영어 단어를 쓰세요.\nWhy are you ____________ ?\n(피곤한 상태를 나타내는 영어 단어 1개)", img: "😩", ans: "tired" },
            { id: 22, type: "short", area: "쓰기", pl: "Level 3 - 우수", q: "22. 앞으로 직진하라는 뜻의 길 안내 표현을 완성하세요.\n_____________ . It's on your left.\n(두 단어를 띄어쓰기하여 적으세요)", ans: ["Go straight", "go straight"] },
            { id: 23, type: "short", area: "쓰기", pl: "Level 3 - 우수", q: "23. 괄호 안의 단어들을 바르게 배열하여 문장을 완성하세요.\n( eyes / has / She / big / blue / . )", ans: ["She has big blue eyes", "She has big blue eyes."] },
            { id: 24, type: "short", area: "쓰기", pl: "Level 4 - 매우 우수", q: "24. 메달을 딴 상황에서 [win, game]을 활용하여 행복한 이유를 나타내는 완전한 영어 문장(Because...)을 쓰세요.", ans: ["Because I won the game", "Because I win the game", "Because I won the game.", "Because I win the game."] },
            { id: 25, type: "short", area: "쓰기", pl: "Level 4 - 매우 우수", q: "25. 머리가 짧고(short hair) 빨간 셔츠를 입은(red shirt) 남자를 묘사하는 두 개의 영어 문장을 He로 시작하여 각각 작성하세요.", ans: ["He has short hair He is wearing a red shirt", "He has short hair. He is wearing a red shirt."] }
        ];

        let currentStudent = null;
        let examTimer = null;

        // 4. UI 및 뷰 컨트롤 함수
        window.switchView = (viewId) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            if(viewId === 'teacher-dashboard-view') {
                window.fetchSubmissions();
            }
        };

        // 5. 학생 평가 진행 로직
        window.startExam = (e) => {
            e.preventDefault();
            if(!currentUser) {
                alert("서버 연결 중입니다. 잠시 후 다시 시도해주세요.");
                return;
            }

            currentStudent = {
                school: document.getElementById('stu-school').value,
                grade: document.getElementById('stu-grade').value,
                class: document.getElementById('stu-class').value,
                number: document.getElementById('stu-number').value,
                name: document.getElementById('stu-name').value,
                timestamp: new Date().toISOString()
            };

            document.getElementById('exam-student-info').innerText = 
                `👩‍🎓 ${currentStudent.school} ${currentStudent.grade}학년 ${currentStudent.class}반 ${currentStudent.number}번 | ${currentStudent.name}`;
            
            renderQuestions();
            window.switchView('exam-view');
            startTimer(2400); // 40분 (2400초)
        };

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            const omrContainer = document.getElementById('omr-sidebar');
            container.innerHTML = "";
            let omrHtml = "";
            
            questions.forEach((q, idx) => {
                // 음성 재생 버튼 처리
                const audioBtn = q.script ? `<button type="button" onclick="window.playAudio('${q.script.replace(/'/g, "\\'")}')" class="ml-3 inline-flex items-center justify-center bg-blue-100 text-blue-700 hover:bg-blue-200 px-4 py-1.5 rounded-full text-sm font-bold transition shadow-sm"><svg class="w-4 h-4 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 3.5a.5.5 0 0 0-.5.5v12a.5.5 0 0 0 .5.5 5 5 0 0 0 5-5V9a5 5 0 0 0-5-5z"></path></svg>▶ 듣기 재생</button>` : '';
                
                // 이미지/이모지 처리
                const imgElement = q.img ? `<div class="text-5xl text-center py-4 bg-gray-50 rounded-lg my-3 border border-dashed border-gray-300 tracking-widest">${q.img}</div>` : '';

                // 본문 렌더링
                let html = `
                    <div id="q-container-${q.id}" class="pt-8 first:pt-4 scroll-mt-28 font-normal">
                        <div class="flex items-center bg-gray-50 border border-gray-200 p-3 rounded-lg mb-4 w-fit">
                            <span class="font-extrabold text-gray-700">[${q.area} 영역]</span>
                            ${audioBtn}
                        </div>
                        ${imgElement}
                        <p class="text-lg font-bold text-gray-800 mb-5 whitespace-pre-line leading-relaxed">${q.q}</p>
                `;

                if(q.type === 'choice') {
                    html += `<div class="space-y-2 ml-2">`;
                    q.options.forEach((opt, oIdx) => {
                        html += `
                            <label class="flex items-center space-x-3 p-3 hover:bg-indigo-50 rounded-lg cursor-pointer border border-transparent hover:border-indigo-100 transition">
                                <input type="radio" name="q-${q.id}" value="${oIdx}" required class="h-5 w-5 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                                <span class="text-gray-700 font-medium text-base">${opt}</span>
                            </label>
                        `;
                    });
                    html += `</div>`;
                } else {
                    html += `
                        <input type="text" name="q-${q.id}" required placeholder="여기에 정답을 입력하세요" 
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none mt-2 text-base shadow-sm">
                    `;
                }
                html += `</div>`;
                container.innerHTML += html;
                
                // OMR 사이드바 아이템 생성 (리스트 형태)
                omrHtml += `
                    <div id="omr-box-${q.id}" class="flex justify-between items-center p-2.5 rounded-lg border border-gray-200 bg-white cursor-pointer hover:bg-gray-50 transition" onclick="document.getElementById('q-container-${q.id}').scrollIntoView({behavior: 'smooth'})">
                        <span class="font-extrabold text-gray-600 text-sm whitespace-nowrap mr-2">${q.id}번</span>
                        <span id="omr-val-${q.id}" class="text-gray-400 text-xs font-semibold truncate text-right w-full">미입력</span>
                    </div>
                `;
            });
            
            omrContainer.innerHTML = omrHtml;

            // 폼 입력 시 OMR 갱신 이벤트 등록 (응답 내용 표시)
            document.getElementById('exam-form').addEventListener('input', () => {
                const formData = new FormData(document.getElementById('exam-form'));
                questions.forEach(q => {
                    const val = formData.get(`q-${q.id}`);
                    const box = document.getElementById(`omr-box-${q.id}`);
                    const valSpan = document.getElementById(`omr-val-${q.id}`);

                    if(val && val.toString().trim() !== '') {
                        box.classList.add('border-indigo-500', 'bg-indigo-50');
                        valSpan.classList.replace('text-gray-400', 'text-indigo-700');
                        if(q.type === 'choice') {
                            valSpan.innerText = `(${parseInt(val) + 1})번 선택`;
                        } else {
                            valSpan.innerText = val.toString().trim();
                        }
                    } else {
                        box.classList.remove('border-indigo-500', 'bg-indigo-50');
                        valSpan.classList.replace('text-indigo-700', 'text-gray-400');
                        valSpan.innerText = '미입력';
                    }
                });
            });
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            examTimer = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                document.getElementById('timer').innerText = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(examTimer);
                    alert("시험 시간 40분이 종료되었습니다. 답안지가 자동으로 제출됩니다.");
                    document.getElementById('exam-form').requestSubmit();
                }
            }, 1000);
        }

        window.submitExam = async (e) => {
            e.preventDefault();
            clearInterval(examTimer);
            
            const btn1 = document.getElementById('submit-btn-sidebar');
            const btn2 = document.getElementById('submit-btn-mobile');
            if(btn1) { btn1.disabled = true; btn1.innerText = "제출 중..."; }
            if(btn2) { btn2.disabled = true; btn2.innerText = "제출 중..."; }

            const formData = new FormData(document.getElementById('exam-form'));
            let answers = {};
            let choiceScore = 0; 
            let shortScore = 0;
            let maxChoiceScore = 0;
            let maxShortScore = 0;

            questions.forEach(q => {
                const userVal = formData.get(`q-${q.id}`);
                answers[q.id] = userVal;

                if(q.type === 'choice') {
                    maxChoiceScore++;
                    if(parseInt(userVal) === q.ans) {
                        choiceScore++;
                    }
                } else if(q.type === 'short') {
                    maxShortScore++;
                    if (gradeShortAnswer(q, userVal)) {
                        shortScore++;
                    }
                }
            });

            const submissionData = {
                info: currentStudent,
                answers: answers,
                choiceScore: choiceScore,
                shortScore: shortScore,
                maxChoiceScore: maxChoiceScore,
                maxShortScore: maxShortScore,
                submittedAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, basePath, 'submissions'), submissionData);
                alert("✅ 답안 제출 및 자동 채점이 완료되었습니다. 수고하셨습니다!");
                location.reload();
            } catch(error) {
                console.error("Submit Error: ", error);
                alert("제출 중 오류가 발생했습니다. 교사에게 문의하세요.");
                if(btn1) { btn1.disabled = false; btn1.innerText = "답안 최종 제출"; }
                if(btn2) { btn2.disabled = false; btn2.innerText = "답안지 최종 제출하기"; }
            }
        };

        // 6. 교사용 모드 로직
        window.loginAsTeacher = () => {
            const pwdInput = document.getElementById('teacher-pwd-input').value;
            if(pwdInput === actualPassword) {
                window.switchView('teacher-dashboard-view');
                document.getElementById('teacher-pwd-input').value = "";
            } else {
                alert("비밀번호가 올바르지 않습니다.");
            }
        };

        window.logoutTeacher = () => {
            window.switchView('student-login-view');
        };

        window.fetchSubmissions = async () => {
            if(!currentUser) return;
            const rowsContainer = document.getElementById('student-data-rows');
            rowsContainer.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-gray-400">데이터를 불러오는 중입니다...</td></tr>`;

            try {
                const querySnapshot = await getDocs(collection(db, basePath, 'submissions'));
                
                let totalStudents = 0;
                let sumTotalScore = 0;
                rowsContainer.innerHTML = "";

                if(querySnapshot.empty) {
                    rowsContainer.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-gray-400">제출된 시험 답안이 없습니다.</td></tr>`;
                    document.getElementById('stat-total-students').innerText = "0명";
                    document.getElementById('stat-avg-score').innerText = "0 점";
                    return;
                }

                let submissionsData = [];
                querySnapshot.forEach((docSnap) => {
                    submissionsData.push(docSnap.data());
                });

                submissionsData.sort((a, b) => {
                    const timeA = new Date(a.submittedAt || 0).getTime();
                    const timeB = new Date(b.submittedAt || 0).getTime();
                    return timeB - timeA;
                });

                submissionsData.forEach((data) => {
                    totalStudents++;
                    const cScore = data.choiceScore || 0;
                    const sScore = data.shortScore || 0;
                    sumTotalScore += (cScore + sScore);

                    let ansDetailsHtml = `<div class="space-y-1.5 text-xs max-h-48 overflow-y-auto p-3 bg-gray-50 rounded border border-gray-200 custom-scrollbar">`;
                    questions.forEach(q => {
                        const isChoice = q.type === 'choice';
                        const uAns = data.answers[q.id];
                        let isCorrectHtml = "";
                        
                        if (isChoice) {
                            const correct = parseInt(uAns) === q.ans;
                            isCorrectHtml = correct ? `<span class="text-green-600 font-bold">(O)</span>` : `<span class="text-red-500 font-bold">(X)</span>`;
                            const ansText = uAns !== null ? q.options[parseInt(uAns)] : "미응답";
                            ansDetailsHtml += `<div><span class="font-bold text-gray-600 w-12 inline-block">Q${q.id}.</span> <span class="text-gray-800">${ansText}</span> ${isCorrectHtml}</div>`;
                        } else {
                            const correct = gradeShortAnswer(q, uAns);
                            isCorrectHtml = correct ? `<span class="text-green-600 font-bold">(O)</span>` : `<span class="text-red-500 font-bold">(X)</span>`;
                            ansDetailsHtml += `<div><span class="font-bold text-gray-600 w-12 inline-block">Q${q.id}.</span> <span class="text-indigo-600 font-mono font-bold break-all">${uAns || '미응답'}</span> ${isCorrectHtml}</div>`;
                        }
                    });
                    ansDetailsHtml += `</div>`;

                    const dateStr = new Date(data.info.timestamp).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

                    const rowHtml = `
                        <tr class="hover:bg-indigo-50/30 transition border-b">
                            <td class="px-5 py-4 align-top">
                                <div class="font-bold text-gray-800">${data.info.school}</div>
                                <div class="text-xs text-gray-500 mt-1">${data.info.grade}학년 ${data.info.class}반 ${data.info.number}번</div>
                            </td>
                            <td class="px-5 py-4 align-top">
                                <div class="font-extrabold text-indigo-700 text-base mb-1">${data.info.name}</div>
                                <div class="text-xs text-gray-400">${dateStr}</div>
                            </td>
                            <td class="px-5 py-4 text-center align-top space-y-2">
                                <div><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">선다형 ${cScore} / ${data.maxChoiceScore}</span></div>
                                <div><span class="bg-purple-100 text-purple-800 px-2 py-1 rounded text-xs font-bold">서답형 ${sScore} / ${data.maxShortScore}</span></div>
                                <div class="pt-2 border-t border-gray-100"><span class="text-indigo-900 font-black">총점: ${cScore + sScore}</span></div>
                            </td>
                            <td class="px-5 py-4 w-1/2">${ansDetailsHtml}</td>
                        </tr>
                    `;
                    rowsContainer.innerHTML += rowHtml;
                });

                document.getElementById('stat-total-students').innerText = totalStudents + "명";
                document.getElementById('stat-avg-score').innerText = (sumTotalScore / totalStudents).toFixed(1) + " 점";

            } catch(error) {
                console.error("Fetch Data Error: ", error);
                rowsContainer.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-red-500">데이터를 불러오는 중 권한 에러가 발생했습니다.</td></tr>`;
            }
        };

        // 비밀번호 관리 모달
        window.openPasswordModal = () => { document.getElementById('pwd-modal').classList.remove('hidden'); }
        window.closePasswordModal = () => { 
            document.getElementById('pwd-modal').classList.add('hidden'); 
            document.getElementById('new-teacher-pwd').value = "";
        }
        window.changeTeacherPassword = async () => {
            const newPwd = document.getElementById('new-teacher-pwd').value;
            if(newPwd.trim() === "") return alert("공백은 비밀번호로 사용할 수 없습니다.");
            
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'teacherConfig'), { password: newPwd });
                actualPassword = newPwd;
                alert("✅ 교사용 인증 비밀번호가 성공적으로 변경되었습니다.");
                window.closePasswordModal();
            } catch(error) {
                console.error("Password Update Error:", error);
                alert("비밀번호 변경에 실패했습니다.");
            }
        };
    </script>
</body>
</html>
